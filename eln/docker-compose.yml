services:
  eln:
    build: .
    image: ereztech-eln
    ports:
      - "8092:8091"
    environment:
      - ELN_SECRET_KEY=${ELN_SECRET_KEY:-}
      - ELN_MAX_UPLOAD_MB=${ELN_MAX_UPLOAD_MB:-512}
      - ELN_BROWSE_ROOTS=${ELN_BROWSE_ROOTS:-/nas:/data}
      # Cold storage for closed-out entries. Unset -> Archive button hidden.
      - ELN_ARCHIVE_REMOTE=${ELN_ARCHIVE_REMOTE:-}
      - RCLONE_CONFIG=/rclone/rclone.conf
    volumes:
      - ${ELN_DATA_DIR:-./data}:/data
      - eln_config:/config
      - ${ELN_NAS_DIR:-./nas}:/nas
      # rclone OAuth token, READ-ONLY on purpose. This container runs as root;
      # with a writable mount its rclone rewrites the file on token refresh and
      # it becomes root-owned 0600, locking the host account out of its own
      # config and silently breaking the hourly backup. The host owns the token
      # lifecycle; the container only reads it.
      # compose does not expand "~" — set an absolute path in .env.
      - ${ELN_RCLONE_CONFIG_DIR:-./rclone-config}:/rclone:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/login')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mockha:
    build: ./mock_ha
    image: ereztech-eln-mockha
    profiles: ["demo"]
    ports:
      - "8123:8123"
    restart: unless-stopped

volumes:
  eln_config:
