{% extends "base.html" %}
{% block title %}Structure editor — {{ subtitle }} — Ereztech ELN{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Structure editor</h1>
    <div class="sub">{{ subtitle }}</div>
  </div>
</div>

<div class="card sketcher-card sketcher-shell" id="sketcher-shell">
  <div class="sketcher-top-controls">
    <div class="sketcher-mode-buttons">
      <button class="btn btn-ghost" type="button" id="touch-mode-btn" aria-pressed="false">☝ Touch mode</button>
      <button class="btn btn-ghost" type="button" id="sketcher-fullscreen-btn" aria-pressed="false">⛶ Full screen</button>
    </div>
  </div>
  <div class="sketcher-recovery" id="sketcher-recovery" hidden>
    <span>An unsaved drawing from this device is available.</span>
    <button class="btn btn-xs" type="button" id="recover-sketch">Recover</button>
    <button class="btn btn-xs btn-ghost" type="button" id="discard-sketch">Discard</button>
  </div>
  <iframe id="ketcher-frame" src="{{ url_for('static', filename='ketcher/index.html') }}"
          title="Ketcher chemical structure editor" allow="fullscreen"></iframe>
  <form method="post" id="structure-form" action="{{ action_url }}" class="sketcher-actions">
    <input type="hidden" name="idx" value="{{ idx if idx is not none else '' }}">
    <input type="hidden" name="molfile" id="f-molfile">
    <input type="hidden" name="molfile_v2000" id="f-molfile-v2000">
    <input type="hidden" name="ket" id="f-ket">
    <input type="hidden" name="smiles" id="f-smiles">
    <input type="hidden" name="svg" id="f-svg">
    <input type="text" name="caption" value="{{ caption }}" placeholder="Caption">
    <button class="btn btn-orange" type="submit" id="save-structure-btn" disabled>Save structure</button>
    <a class="btn btn-ghost" href="{{ cancel_url }}">Cancel</a>
    <span class="muted small" id="sketcher-status">Loading sketcher…</span>
  </form>
</div>

<script>
window.INITIAL_MOLFILE = {{ molfile | tojson }};
</script>
{% endblock %}
