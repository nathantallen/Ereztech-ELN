{# Equipment select fields — shared by the entry-page equipment form and the
   New Experiment create form. Expects: equipment_cfg, recording_fps,
   recording_resolutions, and optionally `eq` (the current equipment dict). #}
{% set eq = eq | default({}) %}
<label>Lab hood
  <select name="hood" id="eq-hood">
    <option value="">— none —</option>
    {% for h in equipment_cfg.hoods %}
    <option value="{{ h.name }}" {{ 'selected' if eq.hood == h.name }}>{{ h.name }}</option>
    {% endfor %}
  </select>
</label>
<label>Camera
  <select name="camera" id="eq-camera" data-current="{{ eq.camera or '' }}">
    <option value="">— none —</option>
  </select>
</label>
<div class="span2">
  <label>Sensors to log during the reaction</label>
  <div id="eq-sensors" class="sensor-checks" data-current="{{ (eq.sensors or []) | map(attribute='entity') | join(',') }}"></div>
</div>
<label>Recording frame rate
  <select name="rec_fps">
    {% for f in recording_fps %}
    <option value="{{ f }}" {{ 'selected' if (eq.recording or {}).get('fps', 5) == f }}>{{ f }} fps</option>
    {% endfor %}
  </select>
</label>
<label>Recording resolution
  <select name="rec_resolution">
    {% for r in recording_resolutions %}
    <option value="{{ r }}" {{ 'selected' if (eq.recording or {}).get('resolution', '1280x720') == r }}>{{ r }}</option>
    {% endfor %}
  </select>
</label>
