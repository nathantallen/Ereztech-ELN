<!doctype html><html><head><meta charset="utf-8"><title>{{ batch.lot }} label</title><style>body{font-family:Arial,sans-serif;margin:18px}.label{border:2px solid #111;width:330px;padding:16px}.barcode{display:block;width:100%;height:70px;margin:14px 0}.qr{width:92px;height:92px;float:right;margin-left:12px}.code{font-family:monospace;font-size:14px;letter-spacing:1px;text-align:center;clear:both}h1{font-size:18px;margin:0}p{margin:5px 0;font-size:13px}@media print{body{margin:0}.label{border:0}}</style></head><body onload="window.print()"><section class="label"><h1>{{ material.name }}</h1><p>Lot: <strong>{{ batch.lot }}</strong></p><p>Container: {{ batch.container or '—' }}</p><p>Storage: {{ batch.location or '—' }}</p><img class="qr" src="{{ qr_data_uri }}" alt="QR code for {{ code }}">{{ barcode_svg | safe }}<div class="code">{{ code }}</div></section></body></html>
