services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erezops
      POSTGRES_USER: erezops
      POSTGRES_PASSWORD: erezops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erezops -d erezops"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://erezops:erezops@db:5432/erezops
      SECRET_KEY: change-this-in-production
      # SAP lookup page (read-only OData queries) — set these in your shell or a
      # .env file next to this compose file, e.g.:
      #   SAP_BASE_URL=https://s4hana.ereztech.com:443/sap/opu/odata/sap
      SAP_BASE_URL: ${SAP_BASE_URL:-}
      SAP_USER: ${SAP_USER:-}
      SAP_PASSWORD: ${SAP_PASSWORD:-}
      SAP_CLIENT: ${SAP_CLIENT:-}
      SAP_VERIFY_SSL: ${SAP_VERIFY_SSL:-true}
    ports:
      # 8080 is used by the separately deployed "ereztech-scheduler" container
      - "8090:8000"
    volumes:
      # Folders mounted here become browsable in the app's "Browse…" dialog.
      # Register each under Admin → Doc Roots with a link prefix that maps the
      # container path back to the address users should open.
      # Machine-specific mounts (your Documents, OneDrive, network drives) belong
      # in docker-compose.override.yml (gitignored) — see the .example file.
      - ./shares:/shares

volumes:
  pgdata:
