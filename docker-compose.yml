services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erezops
      POSTGRES_USER: erezops
      POSTGRES_PASSWORD: erezops
    volumes:
      # Database files live in ./pgdata next to this file so they're easy to
      # find and back up. Point this at any absolute path to store them
      # elsewhere, e.g.  - /Users/you/Documents/erezops-db:/var/lib/postgresql/data
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erezops -d erezops"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://erezops:erezops@db:5432/erezops
      SECRET_KEY: change-this-in-production
      # Gunicorn worker processes. Rule of thumb: (2 x CPU cores) + 1.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/login')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Folders mounted here become browsable in the app's "Browse…" dialog.
      # Register each under Admin → Doc Roots with a link prefix that maps the
      # container path back to the address users should open.
      # Machine-specific mounts (your Documents, OneDrive, network drives) belong
      # in docker-compose.override.yml (gitignored) — see the .example file.
      - ./shares:/shares
