- id: hazardous-waste-2025
  part: 9
  title: Hazardous Waste Training 2025
  publisher: Individual uploader
  url: https://www.youtube.com/watch?v=8y0bqvrf0j8
  tracks:
  - waste
  from_transcript: true
  context: >-
    RCRA basics for a Small Quantity Generator: characteristic wastes (ignitable, corrosive,
    reactive, toxic) and listed wastes. SAA containers must be at the point of generation,
    under the operator's control, and closed except when adding waste. Once the 55-gallon
    limit is reached, the container moves to the 90-day storage area within 3 days.
  site_rule: >-
    **Time limits:** RCRA allows an SQG up to 180 days on site (270 days if the disposal facility
    is over 200 miles away) and a 6,000 kg cap. The Ereztech CHP sets a stricter 90 days,
    and that is the limit to follow. **CHP:** Hazard Mat Storage Room #137 holds at most 24
    drums.
- id: nu-nitric-acid-waste
  part: 9
  title: Nitric Acid Waste
  publisher: Northwestern University
  url: https://vimeo.com/163014970
  tracks:
  - waste
  from_transcript: false
  context: >-
    Nitric acid oxidizes organic material in a waste container, producing heat and gas that
    can burst the bottle. Collect nitric acid waste separately and never add it to organic
    solvent waste. Applies to the HNO3 baths.
- id: nu-vented-caps
  part: 9
  title: Vented Caps
  publisher: Northwestern University
  url: https://vimeo.com/nuors/vented-caps
  tracks:
  - waste
  from_transcript: false
  context: >-
    Vented caps relieve pressure from wastes that can keep generating gas, while still keeping
    the container closed as RCRA requires.
- id: nu-triple-rinse
  part: 9
  title: Triple Rinse Procedure
  publisher: Northwestern University
  url: https://vimeo.com/nuors/triple-rinse-procedure
  tracks:
  - waste
  from_transcript: false
  context: >-
    Rinse an empty chemical container three times with a suitable solvent, collect the rinsate
    as hazardous waste, deface the label, then dispose of the container. RCRA requires triple
    rinsing for containers that held acutely hazardous (P-listed) waste.
- id: acs-hydrogen-fluoride
  part: 10
  title: 'Hydrogen Fluoride: Dangerous and Surprisingly Useful'
  publisher: ACS
  url: https://youtu.be/hd3EAzJ_McA
  tracks:
  - hf
  from_transcript: true
  context: >-
    HF stays undissociated until it reaches deep tissue, where it releases fluoride ions that
    destroy tissue and bind calcium and magnesium, causing severe pain and nerve disruption.
    Also covers industrial uses such as etching silicon wafers and making PTFE.
- id: janette-hf-safety
  part: 10
  title: Hydrofluoric Acid Safety
  publisher: j@nette
  url: https://www.youtube.com/watch?v=R62GIezA1Ws
  tracks:
  - hf
  from_transcript: true
  context: >-
    Work in a fume hood, use the buddy system, and wear PVC or butyl gloves over nitrile,
    goggles, a face shield and a waterproof apron or Tyvek suit. Have a spill kit and calcium
    gluconate gel ready before starting.
  site_rule: >-
    **Correction:** the video lists sodium bicarbonate for the spill kit. Use a calcium-based
    neutralizer, and never sand, kitty litter or other silica absorbents, which react with
    HF to form toxic silicon tetrafluoride gas.
- id: suchard-hf-calcium
  part: 10
  title: Hydrofluoric Acid (Fluorides & Antidotal Calcium)
  publisher: Jeff Suchard
  url: https://www.youtube.com/watch?v=9jF-6QY-smg
  tracks:
  - hf
  - first-aid
  from_transcript: true
  context: >-
    Medical treatment of HF burns. Unlike most acids, HF penetrates deeply, like an alkali
    burn. Decontaminate with water, then apply 2.5% calcium gluconate gel; severe cases with
    persistent pain need calcium gluconate by injection or intra-arterial infusion. Clinical
    in tone, so best suited to first-aid responders.
- id: nu-pressure-vessels
  part: 11
  title: 'Lessons Learned: Pressure Vessels'
  publisher: Northwestern University
  url: https://vimeo.com/nuors/pressurevessels
  tracks:
  - scale-up
  from_transcript: false
  context: >-
    Pressure vessels fail when they are run past their rated pressure or temperature, used
    with damaged parts or seals, or operated without a working relief device. Check the rating
    before every use, fit a relief device, use a blast shield, and inspect seals and fittings.
